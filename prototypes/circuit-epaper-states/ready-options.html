<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circuit Ready mark options</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color:#1b2222; background:#e9edeb; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; }
    .stage { min-height:100vh; width:100%; display:grid; place-items:center; padding:32px 20px 96px; }
    .frame { width:min(100%,520px); display:grid; place-items:center; gap:22px; }
    .caption { text-align:center; max-width:430px; color:#657171; font-size:13px; line-height:1.45; }
    .caption strong { display:block; color:#1b2222; font-size:17px; margin-bottom:6px; }
    .device { width:min(82vw,420px); aspect-ratio:1; padding:16px; border-radius:30px; background:#fff; box-shadow:0 20px 60px rgba(22,40,38,.17),0 0 0 1px rgba(22,40,38,.08); }
    .paper { width:100%; height:100%; padding:13px; background:#f8f8f2; border:1px solid #c9cbc4; box-shadow:inset 0 0 0 1px #fff; color:#111; }
    .epd { width:100%; height:100%; display:flex; flex-direction:column; }
    .top { height:16%; display:flex; align-items:flex-start; justify-content:space-between; border-bottom:2px solid #111; }
    .mark { width:24px; height:24px; display:grid; place-items:center; border:2px solid #111; border-radius:50%; font-size:14px; font-weight:900; }
    .tiny-icons { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; }
    .tiny-icons span { display:inline-flex; width:20px; height:20px; justify-content:center; }
    .tiny-icons svg { width:18px; height:18px; stroke:#111; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .persistent-info { height:30%; display:grid; grid-template-columns:1.28fr .72fr; align-items:center; gap:12px; border-bottom:2px solid #111; }
    .clock-block { text-align:left; } .clock { font-size:53px; letter-spacing:-3px; font-weight:900; line-height:1; }
    .date { margin-top:7px; font-size:15px; font-weight:900; letter-spacing:1.2px; }
    .notes-summary { border-left:3px solid #111; padding-left:12px; text-align:left; }
    .note-count { font-size:26px; line-height:.95; font-weight:900; } .note-label { margin-top:5px; font-size:11px; font-weight:900; letter-spacing:1px; }
    .note-split { display:flex; gap:8px; margin-top:12px; font-size:13px; font-weight:900; } .note-split span:last-child { color:#555; }
    .main { flex:1; display:grid; place-items:center; text-align:center; padding:8px 4px; }
    .takeover { width:100%; height:100%; display:grid; place-items:center; align-content:center; gap:10px; }
    .state-caption { font-size:13px; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; }
    .wordmark { font-weight:1000; letter-spacing:3px; line-height:.86; }
    .wordmark small { display:block; margin-top:12px; font-size:10px; letter-spacing:4px; }
    .wordmark.a { font-size:43px; }
    .wordmark.b { font-size:37px; border:4px solid #111; border-radius:14px; padding:16px 11px 16px; letter-spacing:2px; }
    .wordmark.c { font-size:34px; letter-spacing:1px; transform:skew(-9deg); }
    .wordmark.c span { display:inline-block; border-bottom:7px solid #111; padding-bottom:9px; }
    .wordmark.d { font-family:"Marker Felt","Chalkboard SE","Comic Sans MS",cursive; font-size:55px; font-weight:700; letter-spacing:-3px; line-height:.8; transform:rotate(-3deg); }
    .wordmark.d span { display:inline-block; border-bottom:3px solid #111; padding:0 7px 11px 2px; }
    .mark-icon { width:86px; height:86px; } .mark-icon svg { width:100%; height:100%; fill:none; stroke:#111; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .mark-icon .fill { fill:#111; stroke:none; }
    .proto-picker { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:2147483647; display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:rgba(10,10,10,.82); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; line-height:1; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }
    .proto-picker-highlight { position:absolute; top:4px; left:0; height:28px; border-radius:999px; background:rgba(255,255,255,.12); will-change:transform; }
    .proto-picker[data-ready] .proto-picker-highlight { transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1); }
    @media (prefers-reduced-motion:reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition:none; } }
    .proto-picker-item { position:relative; display:flex; align-items:center; height:28px; padding:0 12px; border:0; border-radius:999px; background:transparent; color:rgba(255,255,255,.55); font:inherit; cursor:pointer; transition:color 150ms ease-out; }
    .proto-picker-item:hover { color:rgba(255,255,255,.85); } .proto-picker-item:active { transform:scale(.97); } .proto-picker-item:focus-visible { outline:2px solid rgba(255,255,255,.4); outline-offset:2px; } .proto-picker-item[data-active] { color:#fff; } .proto-picker-divider { width:1px; height:16px; margin:0 4px; background:rgba(255,255,255,.12); } .proto-picker-replay { padding:0 10px; font-size:14px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Wordmark</button>
    <button class="proto-picker-item">Badge</button>
    <button class="proto-picker-item">Character</button>
    <button class="proto-picker-item">Handwritten</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <script>
    const icon = name => ({phone:'<svg viewBox="0 0 24 24"><path d="M7 4h4l1.2 4-2.2 1.5a13 13 0 0 0 4.5 4.5L16 11.8 20 13v4c0 1.1-.9 2-2 2C10.3 19 5 13.7 5 7a3 3 0 0 1 2-3Z"/></svg>',sd:'<svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M10 5v3M13 5v3M16 8v3"/></svg>'}[name] || '');
    const status = () => `<div class="top"><div class="mark">C</div><div class="tiny-icons"><span>${icon('sd')}</span><span>${icon('phone')}✓</span></div></div>`;
    const info = () => `<div class="persistent-info"><div class="clock-block"><div class="clock">09:42</div><div class="date">FRI 04 OCT</div></div><div class="notes-summary"><div class="note-count">12</div><div class="note-label">NOTES</div><div class="note-split"><span>✓ 9</span><span>◌ 3</span></div></div></div>`;
    const shell = body => `<div class="epd">${status()}${info()}<div class="main">${body}</div></div>`;
    const wordmark = () => shell(`<div class="takeover"><div class="wordmark a">CIRCUIT</div></div>`);
    const badge = () => shell(`<div class="takeover"><div class="wordmark b">CIRCUIT</div></div>`);
    const character = () => shell(`<div class="takeover"><div class="mark-icon"><svg viewBox="0 0 88 88"><path d="M22 31h44v29H22z"/><path d="M22 37 10 31v18l12-5M66 37l12-6v18l-12-5"/><path d="M30 31 35 19h18l5 12"/><path d="M29 60c8 7 22 7 30 0"/><circle class="fill" cx="35" cy="43" r="4"/><circle class="fill" cx="53" cy="43" r="4"/></svg></div><div class="state-caption">READY</div></div>`);
    const handwritten = () => shell(`<div class="takeover"><div class="wordmark d"><span>circuit</span></div></div>`);
    const variants=[wordmark,badge,character,handwritten];
    const captions=['Strongest glanceable identity; best for the everyday idle screen.','Most logo-like and memorable; uses more pixels and can feel heavier.','Adds personality without copying movie artwork; less direct as a wordmark.','Closest to Pala Note’s hand-lettered feel; most playful, but font must become a bitmap for firmware.'];
    const labels=['Wordmark','Badge','Character','Handwritten']; const stage=document.getElementById('stage'); const picker=document.querySelector('.proto-picker'); const highlight=picker.querySelector('.proto-picker-highlight'); const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')]; const replay=picker.querySelector('.proto-picker-replay'); let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=`<div class="frame"><div class="device">${variants[i]()}</div><div class="caption"><strong>${labels[i]}</strong>${captions[i]}</div></div>`;});}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i))); replay.addEventListener('click',()=>mount(current)); window.addEventListener('resize',moveHighlight); document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current);});
    setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
