name: App

on:
  pull_request:
    paths:
      - "apps/short_circuit/**"
      - "docs/security/test-vectors.json" # the vectors both sides check against; the README alone does not rebuild
      - "docs/security/reference/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/release-notes.sh"
  push:
    branches: [main, development]
    paths:
      - "apps/short_circuit/**"
      - "docs/security/test-vectors.json" # the vectors both sides check against; the README alone does not rebuild
      - "docs/security/reference/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/release-notes.sh"
    tags: ["app-v*"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/short_circuit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze (errors and warnings fail; infos do not)
        run: flutter analyze --no-fatal-infos
      - run: flutter test
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/short_circuit/android/**/*.gradle*
            apps/short_circuit/android/**/gradle-wrapper.properties
      - name: Check the phone's note encryption against the shared test vectors
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:testDebugUnitTest --no-daemon

  apk:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/short_circuit
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/short_circuit/android/**/*.gradle*
            apps/short_circuit/android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Add the Firebase config
        # Not a secret as such, but kept out of the repository. Without it the build
        # is the same and the app's Firebase code does nothing.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Firebase config added."
          else
            echo "::notice::No GOOGLE_SERVICES_JSON_BASE64 secret: this build has no Firebase reporting."
          fi

      - name: Work out the version
        id: version
        # CI is the only place that decides the version; the code ignores pubspec.yaml's.
        # The name is the tag's for a release and beta.<run number> otherwise. The number is the
        # time, in 10-second steps since 2026-01-01 UTC, so whichever build was made last has the
        # higher number: an update from App Distribution or a release is never refused as a
        # downgrade, which would force an uninstall and wipe the app's settings. A build made by
        # hand gets the same formula from android/app/build.gradle.kts.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            name="${GITHUB_REF_NAME#app-v}"
            [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The tag must look like app-v1.2.3"; exit 1; }
          else
            name="beta.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$(( ($(date -u +%s) - 1767225600) / 10 ))" >> "$GITHUB_OUTPUT"

      - name: Set up signing
        id: signing
        # The secrets are only visible to this step, not to the other actions or the build.
        # Without them the APK is signed with a throwaway debug key, which cannot update an
        # app that is already installed from another build.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Proof that the release key replaces the key the installed app was signed with.
          ANDROID_LINEAGE_BASE64: ${{ secrets.ANDROID_LINEAGE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            if [[ -n "$ANDROID_LINEAGE_BASE64" ]]; then
              echo "$ANDROID_LINEAGE_BASE64" | base64 --decode > android/app/rotation.lineage
              echo "lineageFile=$PWD/android/app/rotation.lineage" >> android/key.properties
            else
              echo "::warning::No ANDROID_LINEAGE_BASE64 secret: this APK is signed with the release key but carries no rotation proof, so it cannot update an app that was installed signed with the previous key."
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
              echo "::error::A release needs the signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). See docs/ci-cd.md."
              exit 1
            fi
            echo "::warning::No signing key configured: this APK uses a throwaway debug key and cannot update an installed copy."
          fi

      - name: Build
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.number }}
        run: flutter build apk --release

      - name: Attach the key-rotation proof
        if: steps.signing.outputs.signed == 'true'
        run: tool/sign_with_lineage.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Name and describe the APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          out="short-circuit-$VERSION_NAME-$VERSION_NUMBER.apk"
          apksigner="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)"
          cp build/app/outputs/flutter-apk/app-release.apk "$out"
          sha256sum "$out" | tee "$out.sha256"
          {
            echo "### Short-Circuit APK"
            echo "- Version: \`$VERSION_NAME\` (build $VERSION_NUMBER)"
            echo "- Signed with: $([[ "$SIGNED" == 'true' ]] && echo 'the release key' || echo 'a throwaway debug key (cannot update an installed copy)')"
            echo "- Signing certificate: \`$("$apksigner" verify --print-certs "$out" 2>/dev/null | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1)\`"
            echo "- Size: $(du -h "$out" | cut -f1)"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$out.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: short-circuit-apk
          path: |
            apps/short_circuit/short-circuit-*.apk
            apps/short_circuit/short-circuit-*.apk.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish a GitHub release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: short-circuit-apk
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Short-Circuit app ${{ needs.apk.outputs.version }}
          files: |
            short-circuit-*.apk
            short-circuit-*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  distribute:
    name: Send to Firebase App Distribution
    # Every push to development (so each change is tried on a phone before it reaches main),
    # release tags and manual runs. Not main: that is the production branch, released by tag.
    # Only once Firebase is set up (see docs/ci-cd.md). The build is the signed one made by the
    # apk job.
    if: >-
      (startsWith(github.ref, 'refs/tags/app-v')
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref == 'refs/heads/development'))
      && vars.FIREBASE_APP_ID != ''
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # to read the pull request this build came from, for the release notes
    steps:
      # Before the download, which this would otherwise clean away.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: short-circuit-apk
      - name: Check the build is signed with the release key
        env:
          SIGNED: ${{ needs.apk.outputs.signed }}
        run: |
          [[ "$SIGNED" == "true" ]] || { echo "::error::This build uses a throwaway debug key and cannot update the app on your phone. Set the signing secrets first."; exit 1; }
      - id: apk
        run: echo "path=$(ls short-circuit-*.apk | head -1)" >> "$GITHUB_OUTPUT"
      - name: Write the release notes
        # The build, then the "How to test" section of the pull request(s) it came from.
        # Best effort: a build with no notes is still sent.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          gh api "repos/$REPO/commits/$SHA/pulls" 2>/dev/null > prs.json || echo '[]' > prs.json
          bash .github/scripts/release-notes.sh < prs.json | head -c 8000 > release-notes.txt || true
          [[ -s release-notes.txt ]] || echo "Short-Circuit $VERSION from $REF_NAME (${SHA::7})" > release-notes.txt
          cat release-notes.txt
      - uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotesFile: release-notes.txt
